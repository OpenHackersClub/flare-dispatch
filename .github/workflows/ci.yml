name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it uses the node:sqlite builtin).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Verify the committed `actions/flare-dispatch-action/dist/index.js`
      # matches a fresh build from `packages/cli/src/`. JS Actions execute the
      # committed bundle verbatim — without this gate, a PR can edit `dist/`
      # directly (or skip a rebuild after a source change) and the Action
      # runs code the unit tests never see. Security review H1 / code M2.
      - name: Verify action bundle matches source
        run: pnpm --filter @flare-dispatch/cli build

      - name: Fail if action bundle is out of date
        run: git diff --exit-code -- actions/flare-dispatch-action/dist/
