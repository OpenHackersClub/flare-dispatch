# FlareDispatch CI — dogfooding itself.
#
# Two parallel signals on every PR / push to main:
#
#   1. `typecheck` — runs on GHA. Fast, deterministic, no infra needed; this is
#      the deterministic guardrail that catches contract breaks before anything
#      hits the Dispatcher. Also verifies the committed Action bundle matches
#      a fresh build from source (JS Actions execute the committed bundle
#      verbatim — without this gate a PR could edit `dist/` directly or skip
#      the rebuild and the Action would run code the unit tests never see).
#
#   2. `dispatch-test` — HMAC-POSTs `offload-test` to the live Dispatcher
#      (`vars.FLAREDISPATCH_ENDPOINT`). The Dispatcher boots a CF Sandbox
#      container, clones the PR head SHA, runs `pnpm test` inside it, streams
#      logs to R2, and reports the verdict back to the PR as the
#      `flare-dispatch/offload-test` check-run.
#
#      The GHA step is fire-and-forget — it returns in seconds on HTTP 202 and
#      is NOT a meaningful pass/fail signal. Require the
#      `flare-dispatch/offload-test` check-run in branch protection, not this
#      GHA job. (Branch-protection wiring lives outside this file.)
#
#      Gated on `vars.FLAREDISPATCH_ENDPOINT` — forks / BYOC deployers without
#      an endpoint configured get a clear "skipped" notice instead of a hard
#      failure.
#
# Why typecheck (and bundle-drift) stays here: both are cheap, deterministic,
# and shouldn't burn a Container roundtrip. Why `pnpm test` offloads: it's
# the expensive half; running it on Cloudflare is the whole point of the
# project.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck + bundle-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it uses the node:sqlite builtin).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Verify the committed `actions/flare-dispatch-action/dist/index.js`
      # matches a fresh build from `packages/cli/src/`. JS Actions execute the
      # committed bundle verbatim — without this gate, a PR can edit `dist/`
      # directly (or skip a rebuild after a source change) and the Action
      # runs code the unit tests never see. Security review H1 / code M2.
      - name: Verify action bundle matches source
        run: pnpm --filter @flare-dispatch/cli build

      - name: Fail if action bundle is out of date
        run: git diff --exit-code -- actions/flare-dispatch-action/dist/

      # The `spec-drift-pr` / `ci-triage-pr` recipe mirrors are generated from
      # their deployed runs by `scripts/sync-recipes.mjs`. Fail if a run was
      # edited without regenerating its recipe (run `pnpm sync-recipes`).
      - name: Verify recipe mirrors match their runs
        run: node scripts/sync-recipes.mjs --check

  dispatch-test:
    name: dispatch offload-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FlareDispatch not configured — skipping
        if: vars.FLAREDISPATCH_ENDPOINT == ''
        run: |
          echo "::notice::dispatch-test skipped — FLAREDISPATCH_ENDPOINT is not set."
          echo "Set repo variable FLAREDISPATCH_ENDPOINT and secret FLAREDISPATCH_HMAC to enable."

      - name: Dispatch offload-test
        if: vars.FLAREDISPATCH_ENDPOINT != ''
        uses: ./actions/flare-dispatch-action
        with:
          run: offload-test
          endpoint: ${{ vars.FLAREDISPATCH_ENDPOINT }}
          hmac-secret: ${{ secrets.FLAREDISPATCH_HMAC }}
          # PR events: clone the PR head from the head repo (handles fork PRs).
          # push events: clone the pushed SHA from this repo.
          inputs: |
            {
              "repo": "${{ github.event.pull_request.head.repo.full_name || github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "command": "pnpm test"
            }
          mode: fire-and-forget
