# FlareDispatch CI — dogfooding itself.
#
# Three parallel signals on every PR / push to main:
#
#   1. `typecheck` — runs on GHA. Fast, deterministic, no infra needed; this is
#      the deterministic guardrail that catches contract breaks before anything
#      hits the Dispatcher. Also verifies the committed Action bundle matches
#      a fresh build from source (JS Actions execute the committed bundle
#      verbatim — without this gate a PR could edit `dist/` directly or skip
#      the rebuild and the Action would run code the unit tests never see).
#
#   2. `dispatch-test` — HMAC-POSTs `offload-test` to the live Dispatcher
#      (`vars.FLAREDISPATCH_ENDPOINT`). The Dispatcher boots a CF Sandbox
#      container, clones the PR head SHA, runs `pnpm test` inside it, streams
#      logs to R2, and reports the verdict back to the PR as the
#      `flare-dispatch/offload-test` check-run.
#
#      The GHA step is fire-and-forget — it returns in seconds on HTTP 202 and
#      is NOT a meaningful pass/fail signal. Require the
#      `flare-dispatch/offload-test` check-run in branch protection, not this
#      GHA job. (Branch-protection wiring lives outside this file.)
#
#      Gated on `vars.FLAREDISPATCH_ENDPOINT` — forks / BYOC deployers without
#      an endpoint configured get a clear "skipped" notice instead of a hard
#      failure.
#
#   3. `dispatch-pr-review` — Action-mode dispatch of the `pr-review` run
#      against this PR (recipes/ai-code-review/ci.yml, inlined). Webhook mode
#      is preferred long-term (zero GHA minutes, the run's own `gate` filters
#      drafts/bots), but Action mode dogfoods the full review path today
#      without depending on the App's webhook delivery. The job-level `if`
#      mirrors the webhook gate: skip drafts (unless `request-ai-review`),
#      skip `skip-ai-review`, skip bot authors, and skip fork PRs (secrets
#      are unavailable there, so the HMAC dispatch cannot authenticate).
#      Fire-and-forget like dispatch-test — the verdict lands as the
#      `flare-dispatch/pr-review` check-run + a PR review comment.
#
# Why typecheck (and bundle-drift) stays here: both are cheap, deterministic,
# and shouldn't burn a Container roundtrip. Why `pnpm test` offloads: it's
# the expensive half; running it on Cloudflare is the whole point of the
# project.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck + bundle-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (it uses the node:sqlite builtin).
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Verify the committed `actions/flare-dispatch-action/dist/index.js`
      # matches a fresh build from `packages/cli/src/`. JS Actions execute the
      # committed bundle verbatim — without this gate, a PR can edit `dist/`
      # directly (or skip a rebuild after a source change) and the Action
      # runs code the unit tests never see. Security review H1 / code M2.
      - name: Verify action bundle matches source
        run: pnpm --filter @flare-dispatch/cli build

      - name: Fail if action bundle is out of date
        run: git diff --exit-code -- actions/flare-dispatch-action/dist/

      # The `spec-drift-pr` / `ci-triage-pr` recipe mirrors are generated from
      # their deployed runs by `scripts/sync-recipes.mjs`. Fail if a run was
      # edited without regenerating its recipe (run `pnpm sync-recipes`).
      - name: Verify recipe mirrors match their runs
        run: node scripts/sync-recipes.mjs --check

      # The language-agnostic JSON Schema artifact for `signals/v1` is generated
      # from `scripts/emit-signals-schema.mjs`. Fail if the committed
      # `schemas/signals.v1.schema.json` is stale (run `pnpm emit-signals-schema`).
      - name: Verify signals JSON Schema is in sync
        run: node scripts/emit-signals-schema.mjs --check

      # Same gate for the `incident/v1` fix-side contract
      # (`scripts/emit-incident-schema.mjs` → `schemas/incident.v1.schema.json`).
      - name: Verify incident JSON Schema is in sync
        run: node scripts/emit-incident-schema.mjs --check

  # The `dispatch-test` dogfood job (an `offload-test` sandbox run on every
  # PR/push) was removed: each dispatch held a sandbox container — DO +
  # container duration billing — to duplicate what the native `typecheck` job
  # already gates, and the policy is that `pr-review` is the only sandbox run
  # dispatched per merge/PR. Dogfood `offload-test` manually via the action
  # when exercising the dispatch path itself.

  dispatch-pr-review:
    name: dispatch pr-review
    runs-on: ubuntu-latest
    # Mirror the webhook-mode gate (pr-review.run.ts `gate`): non-draft unless
    # labeled `request-ai-review`, never on `skip-ai-review`, never for bot
    # authors. Same-repo PRs only — fork PRs get no secrets, so the HMAC
    # dispatch can't authenticate anyway.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (!github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'request-ai-review')) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: FlareDispatch not configured — skipping
        if: vars.FLAREDISPATCH_ENDPOINT == ''
        run: |
          echo "::notice::dispatch-pr-review skipped — FLAREDISPATCH_ENDPOINT is not set."
          echo "Set repo variable FLAREDISPATCH_ENDPOINT and secret FLAREDISPATCH_HMAC to enable."

      # App-mode writeback: the Dispatcher only posts the verdict back (check-run
      # + PR review comment) when the dispatch carries a real `installation_id`
      # AND the Worker has GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY set
      # (apps/dispatcher/src/workflow.ts `resolveChecksConfig`). The installation
      # id is non-secret — resolve once via `gh api orgs/<org>/installations` and
      # store it in repo var FLAREDISPATCH_INSTALLATION_ID. Unset ⇒ the action
      # defaults installation-id to "0", which the Dispatcher rejects as "do not
      # post" — i.e. the prior fire-and-forget-without-writeback behavior.
      - name: Dispatch pr-review
        if: vars.FLAREDISPATCH_ENDPOINT != ''
        uses: ./actions/flare-dispatch-action
        with:
          run: pr-review
          endpoint: ${{ vars.FLAREDISPATCH_ENDPOINT }}
          hmac-secret: ${{ secrets.FLAREDISPATCH_HMAC }}
          installation-id: ${{ vars.FLAREDISPATCH_INSTALLATION_ID }}
          inputs: |
            {
              "repo": "${{ github.repository }}",
              "sha": "${{ github.event.pull_request.head.sha }}",
              "baseSha": "${{ github.event.pull_request.base.sha }}",
              "pr": ${{ github.event.pull_request.number }}
            }
          mode: fire-and-forget
