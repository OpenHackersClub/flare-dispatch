name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - specs/**
      - recipes/**
      - scripts/emit-benchmarks.mjs
      - .github/workflows/deploy-docs.yml
  pull_request:
    paths:
      - apps/docs/**
      - specs/**
      - recipes/**
      - scripts/emit-benchmarks.mjs
      - .github/workflows/deploy-docs.yml

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip forked-PR runs — they lack the Cloudflare secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # No `version:` — pnpm/action-setup reads `packageManager` from the
        # root package.json (matching ci.yml). Pinning a version here as well
        # makes action-setup error on "multiple versions specified".
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/docs
        # apps/docs is a standalone project with its own lockfile, NOT a member
        # of the root pnpm-workspace.yaml. apps/docs/pnpm-workspace.yaml makes
        # pnpm treat it as its own single-project root (so it does not climb to
        # the root workspace) AND carries the `allowBuilds` allowlist pnpm 11
        # needs. `--ignore-workspace` is NOT used: it would also make pnpm
        # ignore that file's settings, re-triggering ERR_PNPM_IGNORED_BUILDS.
        run: pnpm install --frozen-lockfile

      - name: Generate benchmarks dataset
        # Regenerate apps/docs/src/data/benchmarks.json from the rate card so the
        # /benchmarks page always reflects the latest profiles. Plain bare-node
        # (no deps); the committed file is drift-guarded by cost.test.ts in CI.
        run: node scripts/emit-benchmarks.mjs

      - name: Type-check
        working-directory: apps/docs
        run: pnpm check

      - name: Build
        working-directory: apps/docs
        run: pnpm build

      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: pages project create flare-dispatch-docs --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: pages deploy dist --project-name=flare-dispatch-docs --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: deploy-docs-preview
          message: |
            ### 📘 Docs preview deployed

            **Preview:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            <sub>This branch alias is stable across pushes. Latest build: ${{ steps.deploy.outputs.deployment-url }}</sub>
