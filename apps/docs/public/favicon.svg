<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cloudflare-leaning: white ground, CF orange #F38020 outer, golden #FAAE40 inner, near-black arc -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  <!-- Trajectory arc: launch from bottom-left, curves up into the base of the flame at (40,30) -->
  <path d="M8 58 Q10 40 26 34 T40 30" fill="none" stroke="#13131A" stroke-width="6.5" stroke-linecap="round"/>
  <!-- CF-style flame at upper-right. Tall, asymmetric, leaning slightly right.
       Two-tone: outer CF orange, inner golden. Tip is a single sharp point, not a notch. -->
  <g transform="translate(42 22)">
    <!-- Outer flame -->
    <path d="
      M 2 -22
      C 6 -14, 12 -10, 13 -2
      C 14 6, 9 12, 1 12
      C -7 12, -13 6, -12 -2
      C -11 -8, -6 -10, -4 -14
      C -2 -18, 0 -20, 2 -22 Z
    " fill="#F38020"/>
    <!-- Inner flame: smaller, similar shape, slightly offset upward -->
    <path d="
      M 3 -16
      C 5 -10, 9 -7, 9 -1
      C 9 4, 6 8, 1 8
      C -4 8, -7 4, -7 -1
      C -7 -5, -4 -7, -2 -10
      C 0 -13, 2 -15, 3 -16 Z
    " fill="#FAAE40"/>
  </g>
</svg>
