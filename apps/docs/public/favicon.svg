<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#f4f1ea"/>
  <!-- Trajectory arc: launch from bottom-left, arcs up into the flare at (42,22) -->
  <path d="M8 58 Q10 38 26 30 T42 22" fill="none" stroke="#13131A" stroke-width="6.5" stroke-linecap="round"/>
  <!-- CF-inflected flare at (42,22): golden flare rays radiate behind a soft rounded
       cloud-burst silhouette in CF orange. Hot incandescent core anchors "burst of light." -->
  <g transform="translate(42 22)">
    <!-- Golden ray spikes (longer N/E/NE convey upward-right velocity) -->
    <path d="M0 -26 L3.5 -10 L0 -6 L-3.5 -10 Z" fill="#FAAE40"/>
    <path d="M26 0 L9 3.5 L5 0 L9 -3.5 Z" fill="#FAAE40"/>
    <path d="M19 -19 L5 -5 L0 -8 L-3 -3 Z" fill="#FAAE40"/>
    <path d="M0 22 L3.5 9 L0 5 L-3.5 9 Z" fill="#FAAE40"/>
    <path d="M-20 0 L-9 3 L-5 0 L-9 -3 Z" fill="#FAAE40"/>
    <path d="M16 16 L4 6 L0 9 L6 4 Z" fill="#FAAE40"/>
    <path d="M-16 16 L-4 6 L0 9 L-6 4 Z" fill="#FAAE40"/>
    <path d="M-13 -13 L-4 -3 L0 -7 L-7 0 Z" fill="#FAAE40"/>
    <!-- Cloud-burst silhouette: stylized CF-cloud — four rounded top bumps,
         soft rounded sides, gently curved bottom. CF orange #F38020. -->
    <path d="
      M -11 6
      C -14 6, -14 -1, -10 -3
      C -11 -8, -5 -11, -2 -8
      C -2 -13, 4 -13, 5 -9
      C 7 -12, 13 -9, 11 -4
      C 14 -3, 14 4, 10 5
      C 12 9, 5 11, 3 8
      C 1 11, -5 10, -5 7
      C -9 9, -13 5, -11 6
      Z
    " fill="#F38020"/>
    <!-- Hot center: golden inner + white incandescent core -->
    <circle r="4.5" fill="#FAAE40"/>
    <circle r="2" fill="#FFFFFF"/>
  </g>
</svg>
